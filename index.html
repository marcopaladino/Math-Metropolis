<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoMo Creator</title>
<style>
  body {
    margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center;
  }
  h1 { margin-top: 0; }
  .app-container {
    display: flex; flex-direction: column; width: 100%; max-width: 800px; gap: 20px;
  }
  
  .viewer-container {
    position: relative; width: 100%; aspect-ratio: 16/9; background-color: #000; 
    border-radius: 8px; overflow: hidden; border: 2px solid #333;
  }
  video, canvas#previewCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
  }
  canvas#previewCanvas { pointer-events: none; }
  
  .controls {
    display: flex; justify-content: space-between; align-items: center; padding: 15px; 
    background: #1e1e1e; border-radius: 8px; flex-wrap: wrap; gap: 10px;
  }
  .control-group { display: flex; gap: 10px; align-items: center; }
  
  button {
    padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; 
    cursor: pointer; transition: background 0.2s; color: white;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .btn-primary { background-color: #4CAF50; }
  .btn-primary:hover:not(:disabled) { background-color: #45a049; }
  
  /* Dynamic Play/Stop Button Colors */
  .btn-blue { background-color: #007bff; }
  .btn-blue:hover:not(:disabled) { background-color: #0056b3; }
  
  .btn-red { background-color: #8b0000; }
  .btn-red:hover:not(:disabled) { background-color: #600000; }
  
  .btn-danger { background-color: #f44336; }
  .btn-danger:hover:not(:disabled) { background-color: #da190b; }
  
  .btn-secondary { background-color: #555; }
  .btn-secondary:hover:not(:disabled) { background-color: #444; }

  .timeline {
    display: flex; gap: 10px; overflow-x: auto; padding: 15px; 
    background: #1e1e1e; border-radius: 8px; min-height: 80px;
  }
  .frame-thumb {
    width: 100px; height: 56px; background-color: #333; border-radius: 4px; 
    object-fit: cover; border: 2px solid transparent;
  }
  
  .toggle-container {
    display: flex; align-items: center; gap: 8px; font-size: 14px;
  }
  input[type="checkbox"] { accent-color: #4CAF50; width: 16px; height: 16px; }

  #error-msg {
    display: none; background: #8b0000; color: white; padding: 15px; 
    border-radius: 8px; margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>StoMo Creator</h1>
  
  <div id="error-msg">
    <strong>Camera Access Denied</strong><br>
    If you are on a Google Site, camera access is blocked in embedded iframes. Please host this tool on a standalone page.
  </div>

  <div class="viewer-container">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <canvas id="previewCanvas"></canvas> 
  </div>

  <div class="controls">
    <!-- Left Side: Capture & Previous Frame -->
    <div class="control-group">
      <button id="captureBtn" class="btn-primary">Capture Frame</button>
      <div class="toggle-container">
        <input type="checkbox" id="onionSkinToggle">
        <label for="onionSkinToggle">Previous Frame</label>
      </div>
    </div>

    <!-- Center: Playback Controls (Single Toggle Button) -->
    <div class="control-group">
      <label for="fps">FPS:</label>
      <input type="number" id="fps" value="5" min="1" max="30" style="width: 50px; padding: 5px; border-radius: 4px; border: none;">
      <button id="playStopBtn" class="btn-blue">Play</button>
    </div>

    <!-- Right Side: Clear & Save -->
    <div class="control-group">
      <button id="clearBtn" class="btn-danger">Clear</button>
      <button id="saveBtn" class="btn-secondary" disabled>Save Video</button>
    </div>
  </div>

  <div class="timeline" id="timeline"></div>
</div>

<script>
  const cameraFeed = document.getElementById('cameraFeed');
  const previewCanvas = document.getElementById('previewCanvas');
  const ctx = previewCanvas.getContext('2d');
  const captureBtn = document.getElementById('captureBtn');
  const onionSkinToggle = document.getElementById('onionSkinToggle');
  const playStopBtn = document.getElementById('playStopBtn');
  const fpsInput = document.getElementById('fps');
  const clearBtn = document.getElementById('clearBtn');
  const saveBtn = document.getElementById('saveBtn');
  const timeline = document.getElementById('timeline');
  const errorMsg = document.getElementById('error-msg');

  let frames = [];
  let isPlaying = false;
  let playInterval;
  let currentPlayIndex = 0;
  let stream = null;

  // 1. Initialize camera immediately on load
  window.onload = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      cameraFeed.srcObject = stream;
      cameraFeed.onloadedmetadata = () => {
        previewCanvas.width = cameraFeed.videoWidth;
        previewCanvas.height = cameraFeed.videoHeight;
      };
    } catch (err) {
      console.error("Camera error:", err);
      errorMsg.style.display = 'block';
    }
  };

  // 2. Capture Frame
  captureBtn.addEventListener('click', () => {
    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = previewCanvas.width;
    offscreenCanvas.height = previewCanvas.height;
    offscreenCanvas.getContext('2d').drawImage(cameraFeed, 0, 0);
    
    const dataUrl = offscreenCanvas.toDataURL('image/jpeg');
    frames.push(dataUrl);
    updateTimeline();
    updateOnionSkin();
    saveBtn.disabled = false;
  });

  function updateTimeline() {
    timeline.innerHTML = '';
    frames.forEach((src) => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'frame-thumb';
      timeline.appendChild(img);
    });
    timeline.scrollLeft = timeline.scrollWidth;
  }

  function updateOnionSkin() {
    ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    if (onionSkinToggle.checked && frames.length > 0 && !isPlaying) {
      const img = new Image();
      img.onload = () => {
        ctx.globalAlpha = 0.4;
        ctx.drawImage(img, 0, 0);
        ctx.globalAlpha = 1.0;
      };
      img.src = frames[frames.length - 1];
    }
  }

  onionSkinToggle.addEventListener('change', updateOnionSkin);

  // 3. Play / Stop Toggle Logic
  playStopBtn.addEventListener('click', () => {
    if (frames.length === 0) return;
    
    if (isPlaying) {
      stopPlayback();
    } else {
      startPlayback();
    }
  });

  function startPlayback() {
    isPlaying = true;
    playStopBtn.textContent = 'Stop';
    playStopBtn.className = 'btn-red';
    
    // Hide camera while playing, show animation on canvas
    ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    cameraFeed.style.opacity = '0';
    
    const fps = parseInt(fpsInput.value) || 5;
    const interval = 1000 / fps;
    
    playInterval = setInterval(() => {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        ctx.drawImage(img, 0, 0);
      };
      img.src = frames[currentPlayIndex];
      
      currentPlayIndex++;
      if (currentPlayIndex >= frames.length) {
        currentPlayIndex = 0; // Loop animation
      }
    }, interval);
  }

  function stopPlayback() {
    isPlaying = false;
    clearInterval(playInterval);
    currentPlayIndex = 0;
    
    playStopBtn.textContent = 'Play';
    playStopBtn.className = 'btn-blue';
    
    cameraFeed.style.opacity = '1';
    updateOnionSkin();
  }

  // 4. Clear Timeline
  clearBtn.addEventListener('click', () => {
    if (confirm("Are you sure you want to delete all frames?")) {
      frames = [];
      updateTimeline();
      updateOnionSkin();
      saveBtn.disabled = true;
      if (isPlaying) stopPlayback();
    }
  });

  // 5. Save Video 
  saveBtn.addEventListener('click', () => {
    if (frames.length === 0) return;
    
    const recCanvas = document.createElement('canvas');
    recCanvas.width = previewCanvas.width;
    recCanvas.height = previewCanvas.height;
    const recCtx = recCanvas.getContext('2d');
    
    const fps = parseInt(fpsInput.value) || 5;
    const recStream = recCanvas.captureStream(fps);
    const mediaRecorder = new MediaRecorder(recStream, { mimeType: 'video/webm' });
    const chunks = [];
    
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'stomo_video.webm'; // Downloads as webm/mp4 compatible format
      a.click();
      URL.revokeObjectURL(url);
      
      saveBtn.textContent = 'Save Video';
      saveBtn.disabled = false;
    };
    
    saveBtn.textContent = 'Saving...';
    saveBtn.disabled = true;
    mediaRecorder.start();
    
    let frameIdx = 0;
    const renderFrame = () => {
      if (frameIdx >= frames.length) {
        mediaRecorder.stop();
        return;
      }
      const img = new Image();
      img.onload = () => {
        recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);
        recCtx.drawImage(img, 0, 0);
        frameIdx++;
        setTimeout(renderFrame, 1000 / fps);
      };
      img.src = frames[frameIdx];
    };
    renderFrame();
  });
</script>
</body>
</html>
