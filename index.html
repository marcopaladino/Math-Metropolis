<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StoMo Creator Dynamic</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');


    body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        color: #f8fafc;
        min-height: 100vh;
        touch-action: manipulation; /* Prevents double-tap zoom delay */
    }


    /* Custom Scrollbar for Timeline */
    .timeline-scroll::-webkit-scrollbar {
        height: 8px;
    }
    .timeline-scroll::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
    }
    .timeline-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
    }
    .timeline-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4);
    }


    /* Custom Toggle Switch */
    .toggle-checkbox:checked {
        right: 0;
        border-color: #68D391;
    }
    .toggle-checkbox:checked + .toggle-label {
        background-color: #68D391;
    }
    .toggle-checkbox:checked + .toggle-label:after {
        transform: translateX(100%);
        border-color: white;
    }
   
    /* Animations */
    @keyframes popIn {
        0% { opacity: 0; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
    }
    .frame-anim {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }


    @keyframes flash {
        0% { background-color: rgba(255,255,255,0.8); }
        100% { background-color: transparent; }
    }
    .flash-active {
        animation: flash 0.3s ease-out;
    }


    /* Modal transition */
    #clearModal {
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-content {
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #clearModal.hidden-modal {
        opacity: 0;
        visibility: hidden;
    }
    #clearModal.hidden-modal .modal-content {
        transform: scale(0.9);
    }
</style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center p-2 sm:p-4">


<div class="w-full h-full max-w-6xl bg-white/5 backdrop-blur-xl border border-white/10 rounded-xl sm:rounded-2xl shadow-2xl p-2 sm:p-4 flex flex-col gap-2 relative">
   
    <!-- Header -->
    <div class="shrink-0 flex flex-col sm:flex-row items-center justify-between gap-2">
        <h1 class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 flex items-center gap-2">
            <i class="fas fa-video text-purple-400"></i> StoMo Creator
        </h1>
       
        <div class="flex flex-wrap justify-center items-center gap-2">
            <!-- Camera Selection -->
            <div class="relative flex items-center bg-slate-800/80 backdrop-blur-md rounded-full border border-white/20 px-4 py-1.5 hover:border-purple-500 transition-colors shadow-lg">
                <i class="fas fa-camera text-purple-400 text-xs mr-2"></i>
                <select id="cameraSelect" class="bg-transparent text-white text-xs sm:text-sm font-semibold outline-none cursor-pointer appearance-none pl-1 pr-7 min-w-[130px]">
                    <option value="" class="text-black">&nbsp;&nbsp;Detecting cameras...</option>
                </select>
                <i class="fas fa-chevron-down text-white/50 text-[10px] absolute right-4 pointer-events-none"></i>
            </div>


            <!-- Filter Selection -->
            <div class="relative flex items-center bg-slate-800/80 backdrop-blur-md rounded-full border border-white/20 px-4 py-1.5 hover:border-purple-500 transition-colors shadow-lg">
                <i class="fas fa-magic text-purple-400 text-xs mr-2"></i>
                <select id="filterSelect" class="bg-transparent text-white text-xs sm:text-sm font-semibold outline-none cursor-pointer appearance-none pl-1 pr-7 min-w-[110px]">
                    <option value="none" class="text-black">&nbsp;&nbsp;Normal</option>
                    <option value="grayscale(100%)" class="text-black">&nbsp;&nbsp;B & W</option>
                    <option value="sepia(100%)" class="text-black">&nbsp;&nbsp;Sepia</option>
                    <option value="contrast(150%) saturate(120%)" class="text-black">&nbsp;&nbsp;Vivid</option>
                    <option value="invert(100%)" class="text-black">&nbsp;&nbsp;Invert</option>
                    <option value="hue-rotate(90deg)" class="text-black">&nbsp;&nbsp;Alien</option>
                    <option value="sepia(40%) hue-rotate(170deg) saturate(200%) contrast(110%)" class="text-black">&nbsp;&nbsp;Underwater</option>
                </select>
                <i class="fas fa-chevron-down text-white/50 text-[10px] absolute right-4 pointer-events-none"></i>
            </div>


            <div class="text-xs sm:text-sm text-white font-bold bg-slate-800/80 px-3 py-1 rounded-full border border-white/20 shadow-lg flex items-center gap-2">
                <i class="fas fa-hard-drive text-slate-500 transition-colors duration-300" id="deviceSaveIcon" title="Device Auto-Save"></i>
                <span id="frameCount">0</span> <span class="hidden sm:inline">Frames</span>
            </div>
        </div>
    </div>


    <!-- Error Message -->
    <div id="error-msg" class="hidden shrink-0 bg-red-500/20 border border-red-500/50 text-red-200 px-3 py-2 rounded-lg flex items-start gap-2 text-xs sm:text-sm">
        <i class="fas fa-exclamation-triangle mt-0.5"></i>
        <div>
            <strong>Camera Access Denied</strong><br>
            <span>Please allow camera permissions to use this tool.</span>
        </div>
    </div>


    <!-- Viewer -->
    <div class="relative flex-1 min-h-0 w-full bg-black rounded-lg overflow-hidden shadow-inner border border-white/10 group">
        <video id="cameraFeed" autoplay playsinline muted class="absolute top-0 left-0 w-full h-full object-contain"></video>
        <canvas id="previewCanvas" class="absolute top-0 left-0 w-full h-full object-contain pointer-events-none"></canvas>
        <div id="flashOverlay" class="absolute inset-0 pointer-events-none"></div>
       
        <!-- Recording/Live Indicator -->
        <div id="statusIndicator" class="absolute top-2 right-2 flex items-center gap-1.5 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-bold text-red-500 transition-opacity">
            <div class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-red-500 animate-pulse"></div>
            LIVE
        </div>
    </div>


    <!-- Controls -->
    <div class="shrink-0 flex flex-wrap lg:flex-nowrap justify-center lg:justify-between items-center gap-2 bg-slate-900/50 p-2 rounded-lg border border-white/5">
       
        <!-- Left: Capture & Onion Skin -->
        <div class="flex items-center gap-2 w-full lg:w-auto justify-center lg:justify-start">
            <button id="captureBtn" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-1.5 sm:py-2 px-3 sm:px-4 rounded-lg shadow-[0_0_15px_rgba(168,85,247,0.4)] transform hover:scale-105 active:scale-95 transition-all duration-200 flex items-center gap-2 text-xs sm:text-sm">
                <i class="fas fa-camera"></i> Capture
            </button>
           
            <div class="flex items-center gap-1.5 bg-slate-800/80 px-2 py-1.5 sm:px-3 sm:py-1.5 rounded-lg border border-white/5">
                <div class="relative inline-block w-8 mr-1 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="onionSkinToggle" checked class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-[3px] appearance-none cursor-pointer z-10 transition-all duration-300"/>
                    <label for="onionSkinToggle" class="toggle-label block overflow-hidden h-4 rounded-full bg-slate-600 cursor-pointer transition-colors duration-300"></label>
                </div>
                <label for="onionSkinToggle" class="text-[10px] sm:text-xs font-semibold text-slate-300 cursor-pointer select-none">Prev Frame</label>
            </div>
        </div>


        <!-- Center: Playback & FPS -->
        <div class="flex items-center justify-center gap-2 sm:gap-3 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-white/5 w-full sm:w-auto">
            <div class="flex flex-col text-[10px] sm:text-xs text-slate-400 font-semibold w-24">
                <div class="flex justify-between mb-0.5">
                    <label for="fps">FPS</label>
                    <span id="fpsValue" class="text-white font-bold">8</span>
                </div>
                <input type="range" id="fps" value="8" min="1" max="24" class="w-full h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
            <div class="w-px h-6 sm:h-8 bg-slate-600 mx-1"></div>
            <button id="playStopBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold w-8 h-8 sm:w-10 sm:h-10 rounded-full shadow-lg transform hover:scale-105 active:scale-95 transition-all duration-200 flex justify-center items-center">
                <i class="fas fa-play ml-0.5 sm:ml-1 text-xs sm:text-sm" id="playIcon"></i>
            </button>
        </div>


        <!-- Right: Clear & Save -->
        <div class="flex items-center justify-center lg:justify-end gap-2 w-full lg:w-auto">
            <button id="clearBtn" class="bg-slate-800 hover:bg-red-600 hover:text-white text-slate-300 font-bold py-1.5 sm:py-2 px-3 sm:px-4 rounded-lg border border-white/5 hover:border-red-500 transform hover:scale-105 active:scale-95 transition-all duration-200 flex items-center gap-1.5 text-xs sm:text-sm">
                <i class="fas fa-trash-alt"></i> Clear
            </button>
            <button id="saveBtn" disabled class="bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed disabled:transform-none text-white font-bold py-1.5 sm:py-2 px-3 sm:px-4 rounded-lg shadow-lg transform hover:scale-105 active:scale-95 transition-all duration-200 flex items-center gap-1.5 text-xs sm:text-sm">
                <i class="fas fa-download"></i> Export
            </button>
        </div>
    </div>


    <!-- Timeline -->
    <div class="shrink-0 bg-slate-900/50 p-2 sm:p-3 rounded-lg border border-white/5">
        <h3 class="text-[10px] sm:text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fas fa-layer-group"></i> Timeline
        </h3>
        <div class="timeline-scroll flex gap-2 overflow-x-auto pb-1.5 min-h-[50px] sm:min-h-[60px]" id="timeline">
            <div class="flex items-center justify-center w-full h-[40px] sm:h-[50px] text-slate-600 text-[10px] sm:text-xs italic" id="emptyTimeline">
                Capture a frame to start...
            </div>
        </div>
    </div>
</div>


<!-- Custom Confirmation Modal -->
<div id="clearModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden-modal">
    <div class="modal-content bg-slate-800 border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl mx-4">
        <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
            <i class="fas fa-exclamation-circle text-red-400"></i> Clear Timeline?
        </h2>
        <p class="text-slate-300 mb-6">Are you sure you want to delete all captured frames? This action cannot be undone.</p>
        <div class="flex justify-end gap-3">
            <button id="cancelClearBtn" class="px-4 py-2 rounded-lg font-semibold text-slate-300 bg-slate-700 hover:bg-slate-600 transition-colors">Cancel</button>
            <button id="confirmClearBtn" class="px-4 py-2 rounded-lg font-semibold text-white bg-red-600 hover:bg-red-500 transition-colors shadow-lg shadow-red-900/20">Yes, Clear All</button>
        </div>
    </div>
</div>


<script>
    const cameraFeed = document.getElementById('cameraFeed');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
   
    const captureBtn = document.getElementById('captureBtn');
    const onionSkinToggle = document.getElementById('onionSkinToggle');
    const playStopBtn = document.getElementById('playStopBtn');
    const playIcon = document.getElementById('playIcon');
    const fpsInput = document.getElementById('fps');
    const fpsValue = document.getElementById('fpsValue');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
   
    const timeline = document.getElementById('timeline');
    const emptyTimeline = document.getElementById('emptyTimeline');
    const errorMsg = document.getElementById('error-msg');
    const frameCountDisplay = document.getElementById('frameCount');
    const flashOverlay = document.getElementById('flashOverlay');
    const statusIndicator = document.getElementById('statusIndicator');
    const deviceSaveIcon = document.getElementById('deviceSaveIcon');
    const cameraSelect = document.getElementById('cameraSelect');
    const filterSelect = document.getElementById('filterSelect');


    // Modal elements
    const clearModal = document.getElementById('clearModal');
    const confirmClearBtn = document.getElementById('confirmClearBtn');
    const cancelClearBtn = document.getElementById('cancelClearBtn');


    let frames = []; // Now stores objects: { id, dataUrl, index }
    let isPlaying = false;
    let playInterval;
    let currentPlayIndex = 0;
    let stream = null;


    // --- LOCAL BROWSER STORAGE (IndexedDB) ---
    // Acts as a temporary file to restore frames on refresh
    let db;
    const DB_NAME = 'StoMoTempDB';
    const STORE_NAME = 'framesStore';


    function initStorage() {
        deviceSaveIcon.classList.remove('fa-memory');
        deviceSaveIcon.classList.add('fa-hard-drive');


        const request = indexedDB.open(DB_NAME, 1);
       
        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };


        request.onsuccess = (event) => {
            db = event.target.result;
            loadFrames();
        };


        request.onerror = (event) => {
            console.error("IndexedDB error:", event.target.errorCode);
            deviceSaveIcon.classList.add('text-red-400');
            deviceSaveIcon.title = "Local storage failed";
        };
    }


    function loadFrames() {
        deviceSaveIcon.classList.add('animate-pulse', 'text-blue-400');
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
       
        request.onsuccess = (event) => {
            frames = event.target.result || [];
            frames.sort((a, b) => a.index - b.index);
           
            updateTimeline();
            updateUIState();
            updateOnionSkin();
           
            deviceSaveIcon.classList.remove('animate-pulse', 'text-blue-400');
            deviceSaveIcon.classList.add('text-emerald-400');
            deviceSaveIcon.title = "Restored from temporary storage";
        };
    }


    // Update FPS display when slider moves
    fpsInput.addEventListener('input', (e) => {
        fpsValue.textContent = e.target.value;
    });


    async function startCamera(deviceId = null) {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
       
        const constraints = {
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }
        };
       
        if (deviceId) {
            constraints.video.deviceId = { exact: deviceId };
        } else {
            constraints.video.facingMode = 'user';
        }


        try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            cameraFeed.srcObject = stream;
            cameraFeed.onloadedmetadata = () => {
                previewCanvas.width = cameraFeed.videoWidth;
                previewCanvas.height = cameraFeed.videoHeight;
                if (frames.length > 0) updateOnionSkin();
            };
            errorMsg.classList.add('hidden');
        } catch (err) {
            console.error("Camera error:", err);
            errorMsg.classList.remove('hidden');
        }
    }


    async function getCameras() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
           
            cameraSelect.innerHTML = '';
            if (videoDevices.length === 0) {
                cameraSelect.innerHTML = '<option value="" class="text-black">&nbsp;&nbsp;No cameras found</option>';
                return;
            }
           
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.innerHTML = `&nbsp;&nbsp;${device.label || `Camera ${index + 1}`}`;
                option.className = "text-black";
                cameraSelect.appendChild(option);
            });
        } catch (err) {
            console.error("Error enumerating devices:", err);
            cameraSelect.innerHTML = '<option value="" class="text-black">&nbsp;&nbsp;Camera access denied</option>';
        }
    }


    cameraSelect.addEventListener('change', (e) => {
        startCamera(e.target.value);
    });


    filterSelect.addEventListener('change', (e) => {
        cameraFeed.style.filter = e.target.value;
    });


    // Initialize camera AND local storage
    window.onload = async () => {
        initStorage(); // Load saved frames in background
        await startCamera(); // Start default to trigger permission prompt
        await getCameras();  // Enumerate now that we have permission
    };


    // Capture Frame
    captureBtn.addEventListener('click', () => {
        if (!stream) return;


        // Visual flash effect
        flashOverlay.classList.remove('flash-active');
        void flashOverlay.offsetWidth; // trigger reflow
        flashOverlay.classList.add('flash-active');


        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = previewCanvas.width;
        offscreenCanvas.height = previewCanvas.height;
       
        const offscreenCtx = offscreenCanvas.getContext('2d');
        offscreenCtx.filter = filterSelect.value;
        offscreenCtx.drawImage(cameraFeed, 0, 0);
       
        const dataUrl = offscreenCanvas.toDataURL('image/jpeg', 0.8);
        const newIndex = frames.length > 0 ? Math.max(...frames.map(f => f.index)) + 1 : 0;
       
        // Create unique ID for local storage
        const newFrameObj = {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            dataUrl,
            index: newIndex
        };
       
        frames.push(newFrameObj);
       
        updateTimeline(newFrameObj, true);
        updateOnionSkin();
        updateUIState();


        // Local DB Save
        if (db) {
            deviceSaveIcon.classList.add('animate-pulse', 'text-blue-400');
            deviceSaveIcon.classList.remove('text-emerald-400');
           
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            store.put(newFrameObj);
           
            transaction.oncomplete = () => {
                deviceSaveIcon.classList.remove('animate-pulse', 'text-blue-400');
                deviceSaveIcon.classList.add('text-emerald-400');
            };
        }
    });


    function createFrameElement(frameObj, animateLast) {
        const wrapper = document.createElement('div');
        wrapper.className = 'relative group flex-shrink-0 w-14 h-[40px] sm:w-20 sm:h-[50px]';
        if (animateLast) wrapper.classList.add('frame-anim');


        const img = document.createElement('img');
        img.src = frameObj.dataUrl;
        img.className = 'w-full h-full bg-slate-800 rounded-lg object-cover border-2 border-transparent group-hover:border-purple-400 transition-colors cursor-pointer';


        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'absolute top-1 right-1 bg-red-600 hover:bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition-all duration-200 z-10 shadow-lg transform hover:scale-110';
        deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
        deleteBtn.title = "Delete Frame";
        deleteBtn.onclick = (e) => {
            e.stopPropagation();
            const index = frames.indexOf(frameObj);
            if (index > -1) {
                frames.splice(index, 1);
                wrapper.remove(); // Smoothly remove from DOM
               
                // Local DB Delete
                if (db && frameObj.id) {
                    deviceSaveIcon.classList.add('animate-pulse', 'text-blue-400');
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    transaction.objectStore(STORE_NAME).delete(frameObj.id);
                   
                    transaction.oncomplete = () => {
                        deviceSaveIcon.classList.remove('animate-pulse', 'text-blue-400');
                        deviceSaveIcon.classList.add('text-emerald-400');
                    };
                }
               
                if (frames.length === 0) {
                    timeline.appendChild(emptyTimeline);
                }
                updateOnionSkin();
                updateUIState();
                if (isPlaying) stopPlayback();
            }
        };


        wrapper.appendChild(img);
        wrapper.appendChild(deleteBtn);
        return wrapper;
    }


    function updateTimeline(newFrameObj = null, animateLast = false) {
        if (frames.length === 0) {
            timeline.innerHTML = '';
            timeline.appendChild(emptyTimeline);
            return;
        }


        if (emptyTimeline.parentNode === timeline) {
            timeline.removeChild(emptyTimeline);
        }


        if (newFrameObj) {
            // Append only the new frame
            const wrapper = createFrameElement(newFrameObj, animateLast);
            timeline.appendChild(wrapper);
        } else {
            // Re-render all
            timeline.innerHTML = '';
            frames.forEach((f) => {
                const wrapper = createFrameElement(f, false);
                timeline.appendChild(wrapper);
            });
        }
       
        // Scroll to right
        setTimeout(() => { timeline.scrollLeft = timeline.scrollWidth; }, 50);
    }


    function updateUIState() {
        frameCountDisplay.textContent = frames.length;
        saveBtn.disabled = frames.length === 0;
    }


    function updateOnionSkin() {
        ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        if (onionSkinToggle.checked && frames.length > 0 && !isPlaying) {
            const img = new Image();
            img.onload = () => {
                ctx.globalAlpha = 0.35;
                ctx.drawImage(img, 0, 0);
                ctx.globalAlpha = 1.0;
            };
            img.src = frames[frames.length - 1].dataUrl;
        }
    }


    onionSkinToggle.addEventListener('change', updateOnionSkin);


    // Playback Logic
    playStopBtn.addEventListener('click', () => {
        if (frames.length === 0) return;
        isPlaying ? stopPlayback() : startPlayback();
    });


    function startPlayback() {
        isPlaying = true;
       
        playStopBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
        playStopBtn.classList.add('bg-red-600', 'hover:bg-red-500');
        playIcon.classList.remove('fa-play', 'ml-1');
        playIcon.classList.add('fa-stop');
       
        statusIndicator.innerHTML = '<div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div> PLAYING';
        statusIndicator.classList.remove('text-red-500');
        statusIndicator.classList.add('text-blue-400');
       
        ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        cameraFeed.style.opacity = '0';
       
        const fps = parseInt(fpsInput.value) || 8;
        const interval = 1000 / fps;
       
        playInterval = setInterval(() => {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = frames[currentPlayIndex].dataUrl;
           
            currentPlayIndex++;
            if (currentPlayIndex >= frames.length) {
                currentPlayIndex = 0;
            }
        }, interval);
    }


    function stopPlayback() {
        isPlaying = false;
        clearInterval(playInterval);
        currentPlayIndex = 0;
       
        playStopBtn.classList.remove('bg-red-600', 'hover:bg-red-500');
        playStopBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
        playIcon.classList.remove('fa-stop');
        playIcon.classList.add('fa-play', 'ml-1');
       
        statusIndicator.innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div> LIVE';
        statusIndicator.classList.remove('text-blue-400');
        statusIndicator.classList.add('text-red-500');
       
        cameraFeed.style.opacity = '1';
        updateOnionSkin();
    }


    // Modal Logic
    clearBtn.addEventListener('click', () => {
        if(frames.length === 0) return;
        clearModal.classList.remove('hidden-modal');
    });


    cancelClearBtn.addEventListener('click', () => {
        clearModal.classList.add('hidden-modal');
    });


    confirmClearBtn.addEventListener('click', () => {
        // Local DB Clear
        if (db) {
            deviceSaveIcon.classList.add('animate-pulse', 'text-blue-400');
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            transaction.objectStore(STORE_NAME).clear();
           
            transaction.oncomplete = () => {
                deviceSaveIcon.classList.remove('animate-pulse', 'text-blue-400');
                deviceSaveIcon.classList.add('text-emerald-400');
            };
        }


        frames = [];
        updateTimeline();
        updateOnionSkin();
        updateUIState();
        if (isPlaying) stopPlayback();
        clearModal.classList.add('hidden-modal');
    });


    // Save Logic
    saveBtn.addEventListener('click', () => {
        if (frames.length === 0) return;
       
        const originalContent = saveBtn.innerHTML;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        saveBtn.disabled = true;


        const recCanvas = document.createElement('canvas');
        recCanvas.width = previewCanvas.width;
        recCanvas.height = previewCanvas.height;
        const recCtx = recCanvas.getContext('2d');
       
        const fps = parseInt(fpsInput.value) || 8;
        const recStream = recCanvas.captureStream(fps);
       
        const options = { mimeType: 'video/webm; codecs=vp9' };
        let mediaRecorder;
        try {
            mediaRecorder = new MediaRecorder(recStream, options);
        } catch(e) {
            mediaRecorder = new MediaRecorder(recStream);
        }
       
        const chunks = [];
       
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `stomo_export_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
           
            saveBtn.innerHTML = originalContent;
            saveBtn.disabled = false;
        };
       
        mediaRecorder.start();
       
        let frameIdx = 0;
        const renderFrame = () => {
            if (frameIdx >= frames.length) {
                mediaRecorder.stop();
                return;
            }
            const img = new Image();
            img.onload = () => {
                recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);
                recCtx.drawImage(img, 0, 0);
                frameIdx++;
                setTimeout(renderFrame, 1000 / fps);
            };
            img.src = frames[frameIdx].dataUrl;
        };
        renderFrame();
    });
</script>
</body>
</html>
